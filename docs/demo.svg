<text x="478.0" y="18" fill="#8b949e" text-anchor="middle" style="font-size:12px">firedrill</text>
<g class="l0"><text x="16" y="54" fill="#7ee787"></text><text x="32.8" y="54" fill="#8b949e" textLength="579.6"># last night&#x27;s backup job was killed halfway through writing the dump</text><rect class="c0" x="32.8" y="40" width="588.0" height="19" fill="#0d1117"/></g>
<g class="l2"><text x="16" y="92" fill="#7ee787">$</text><text x="32.8" y="92" fill="#f0f6fc" textLength="210.0">firedrill run nightly.sql</text><rect class="c2" x="32.8" y="78" width="218.4" height="19" fill="#0d1117"/></g>
<text class="l3" x="16" y="111" fill="#c9d1d9" textLength="184.8" xml:space="preserve">firedrill  nightly.sql</text>
<text class="l4" x="16" y="130" fill="#c9d1d9" textLength="210.0" xml:space="preserve">  archive   plain  67.1KB</text>
<text class="l5" x="16" y="149" fill="#c9d1d9" textLength="705.6" xml:space="preserve">  source    PostgreSQL 16.15 (Debian 16.15-1.pgdg13+2)  -&gt; restored into postgres:16</text>
<text class="l6" x="16" y="168" fill="#c9d1d9" textLength="100.8" xml:space="preserve">  tier: full</text>
<text class="l8" x="16" y="206" fill="#7ee787" textLength="529.2" xml:space="preserve">  [ok  ] fetch       0.01s  68,745 bytes from local  unverified</text>
<text class="l9" x="16" y="225" fill="#7ee787" textLength="562.8" xml:space="preserve">  [ok  ] inspect     0.00s  16.15 (Debian 16.15-1.pgdg13+2) (plain)</text>
<text class="l10" x="16" y="244" fill="#7ee787" textLength="327.6" xml:space="preserve">  [ok  ] target     31.00s  postgres:16</text>
<text class="l11" x="16" y="263" fill="#ff7b72" textLength="285.6" xml:space="preserve">  [FAIL] restore     0.72s  exit 1</text>
<text class="l12" x="16" y="282" fill="#7ee787" textLength="361.2" xml:space="preserve">  [ok  ] smoke       1.12s  1 user table(s)</text>
<text class="l13" x="16" y="301" fill="#8b949e" textLength="537.6" xml:space="preserve">  [n/a ] structure      --  no structure.reference in the config</text>
<text class="l14" x="16" y="320" fill="#8b949e" textLength="478.8" xml:space="preserve">  [n/a ] volume         --  no volume rules in the config</text>
<text class="l15" x="16" y="339" fill="#8b949e" textLength="512.4" xml:space="preserve">  [n/a ] semantics      --  no semantics checks in the config</text>
<text class="l16" x="16" y="358" fill="#e3b341" textLength="344.4" xml:space="preserve">  [warn] integrity   3.19s  1 sequence(s)</text>
<text class="l18" x="16" y="396" fill="#c9d1d9" textLength="126.0" xml:space="preserve">  3 finding(s):</text>
<text class="l19" x="16" y="415" fill="#ff7b72" textLength="907.2" xml:space="preserve">    CRITICAL ARCHIVE_TRUNCATED    the plain-SQL dump doesn&#x27;t end with pg_dump&#x27;s &#x27;-- PostgreSQL database dump</text>
<text class="l20" x="16" y="434" fill="#c9d1d9" textLength="285.6" xml:space="preserve">    complete&#x27; line: it was cut off</text>
<text class="l21" x="16" y="453" fill="#c9d1d9" textLength="663.6" xml:space="preserve">             The backup is incomplete -- the job most likely ran out of disk or</text>
<text class="l22" x="16" y="472" fill="#c9d1d9" textLength="646.8" xml:space="preserve">             was killed. psql restores a truncated dump without any error, so</text>
<text class="l23" x="16" y="491" fill="#c9d1d9" textLength="554.4" xml:space="preserve">             the restore below will look clean while missing data.</text>
<text class="l24" x="16" y="510" fill="#ff7b72" textLength="588.0" xml:space="preserve">    HIGH     RESTORE_ERROR        missing data for column &quot;created_at&quot;</text>
<text class="l25" x="16" y="529" fill="#c9d1d9" textLength="134.4" xml:space="preserve">             ...</text>
<text class="l26" x="16" y="548" fill="#e3b341" textLength="772.8" xml:space="preserve">    MEDIUM   MATVIEW_UNPOPULATED  1 materialized view(s) hold no data and raise on any query</text>
<text class="l28" x="16" y="586" fill="#c9d1d9" textLength="151.2" xml:space="preserve">  total     44.80s</text>
<text class="l30" x="16" y="624" fill="#ff7b72" textLength="453.6" xml:space="preserve">  FAIL -- the restore ran and produced findings above.</text>
</svg>