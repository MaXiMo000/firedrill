[project]
name = "firedrill"
version = "0.1.0"
description = "A backup you have not restored is not a backup. firedrill restores it and proves it is usable."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["postgres", "postgresql", "backup", "restore", "disaster-recovery",
            "rto", "pg_dump", "pg_restore", "verification", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: System :: Recovery Tools",
]
# The archive header is parsed in pure Python and every database operation
# happens inside the target container via `docker exec psql`, so there is no
# host Postgres client and no driver to install. psycopg was planned here and
# deliberately not taken: it would have needed a published port, spending the
# "not reachable from the host" property docker.py relies on, to get typed
# results for queries that only ever return one number.
dependencies = ["PyYAML>=6.0"]

urls.Source = "https://github.com/MaXiMo000/firedrill"
urls.Issues = "https://github.com/MaXiMo000/firedrill/issues"
urls.Changelog = "https://github.com/MaXiMo000/firedrill/releases"

# Placed after the urls above, not before: these are bare `urls.*` keys in the
# [project] table, and starting a new table ahead of them silently reparents
# them into it. The local test suite cannot see that -- only building the
# package can -- so this ordering matters more than it looks.
[project.optional-dependencies]
# boto3 is large and most people restore from a local path or a presigned
# URL, so the s3 source is opt-in.
s3 = ["boto3>=1.34"]

[project.scripts]
firedrill = "firedrill.cli:main"

# Named explicitly. Auto-discovery breaks the moment a second top-level
# directory appears, and it breaks at release time rather than in CI.
[tool.setuptools.packages.find]
include = ["firedrill*"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
