name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.10 is the floor declared in pyproject. Test the floor, not just today.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # Install what pyproject declares, rather than naming packages here.
      # Phase 0 was stdlib-only and this step did not exist; Phase 1 added
      # PyYAML and the suite failed on a clean runner while passing locally,
      # where it happened to already be installed. Installing the project
      # itself means the dependency list cannot drift away from CI again.
      - name: Install the package and its declared dependencies
        # .[s3] because the S3 source tests must genuinely run on Linux, where
        # --require-integration turns a skip into a build failure. Installing
        # the base package would let them skip, and a skipped test that looks
        # like a pass is the failure this whole project is about.
        run: python -m pip install --disable-pip-version-check -e ".[s3]"

      # Linux runners can run Linux containers, so the restore tests MUST run
      # there and --require-integration fails the build if any of them skipped.
      - name: Full suite, integration required
        if: runner.os == 'Linux'
        run: python tests/test_firedrill.py --require-integration

      # Windows runners cannot run Linux containers at all, so the container
      # tests genuinely cannot execute. They skip by name and are counted --
      # the run prints how many, so "it passed" and "it did not run" stay
      # distinguishable. Everything version-independent (the archive header
      # parser, the stderr classifier, the report logic) still runs here,
      # which is where path and subprocess handling actually breaks.
      - name: Pure suite, container tests skip and say so
        if: runner.os == 'Windows'
        run: python tests/test_firedrill.py

  dogfood:
    # The claim has to hold on every commit, not at release time.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install carabiner-sec
      - name: carabiner scans firedrill
        run: carabiner scan --all --fail-on low --sarif firedrill.sarif
      - name: Upload to the Security tab
        uses: github/codeql-action/upload-sarif@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef  # codeql-bundle-v2.26.3
        with:
          sarif_file: firedrill.sarif

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build
        run: docker build -t firedrill:ci .
      - name: It runs, as a non-root user
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint id firedrill:ci -u)" = "10001"
          docker run --rm firedrill:ci --version
      - name: It reports an unreadable archive rather than passing
        # Deliberately a fixture that fails before any container is needed, so
        # this step tests the packaged CLI and not docker-in-docker.
        run: |
          set -euo pipefail
          printf 'PGDMP\x01\x0f\x00\x04\x08\x01' > /tmp/truncated.dump
          out=$(docker run --rm -v /tmp/truncated.dump:/tmp/truncated.dump:ro \
                  firedrill:ci run /tmp/truncated.dump || true)
          echo "$out"
          echo "$out" | grep -q ARCHIVE_UNREADABLE
          echo "$out" | grep -q "COULD NOT VERIFY"
      - name: And exits non-zero when it could not verify
        run: |
          set -euo pipefail
          printf 'PGDMP\x01\x0f\x00\x04\x08\x01' > /tmp/truncated.dump
          if docker run --rm -v /tmp/truncated.dump:/tmp/truncated.dump:ro \
               firedrill:ci run /tmp/truncated.dump --quiet; then
            echo "exited 0 on an unverifiable backup"; exit 1
          fi

  action:
    # The action shipped in this repo, run against this repo. It was written
    # in Phase 3 and had never executed -- and an action nobody has run is the
    # same unverified control this whole tool exists to complain about.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Build a corpus for it to chew on
        run: |
          python -m pip install --disable-pip-version-check -e ".[s3]"
          python tests/make_corpus.py /tmp/corpus

      - name: A healthy backup passes
        id: healthy
        uses: ./
        with:
          install-from: .
          dump: /tmp/corpus/healthy_pg16.dump
          history: /tmp/history.json

      - name: And the outputs say so
        run: |
          set -euo pipefail
          test "${{ steps.healthy.outputs.ok }}" = "true"
          test "${{ steps.healthy.outputs.verified }}" = "true"
          test "${{ steps.healthy.outputs.findings }}" = "0"
          echo "summary was: ${{ steps.healthy.outputs.summary }}"
          case "${{ steps.healthy.outputs.summary }}" in
            "restored in "*", 0 findings") ;;
            *) echo "unexpected summary"; exit 1 ;;
          esac
          test -f firedrill-junit.xml
          test -f firedrill-report.json

      - name: A broken backup fails the build
        id: broken
        continue-on-error: true
        uses: ./
        with:
          install-from: .
          dump: /tmp/corpus/truncated_data.dump

      - name: The inverse, which matters exactly as much
        run: |
          set -euo pipefail
          test "${{ steps.broken.outcome }}" = "failure"
          test "${{ steps.broken.outputs.ok }}" = "false"

      - name: An unverifiable backup also fails, and says which
        id: unverifiable
        continue-on-error: true
        uses: ./
        with:
          install-from: .
          dump: /tmp/corpus/truncated_header.dump

      - name: "'could not verify' is never quieter than 'verified and fine'"
        run: |
          set -euo pipefail
          test "${{ steps.unverifiable.outcome }}" = "failure"
          test "${{ steps.unverifiable.outputs.verified }}" = "false"
          case "${{ steps.unverifiable.outputs.summary }}" in
            "COULD NOT VERIFY"*) ;;
            *) echo "summary did not distinguish unverified from failed"; exit 1 ;;
          esac

  package:
    # Build and install on every commit, not only at release. A packaging break
    # that only surfaces during a release is a break discovered at the worst time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install build && python -m build
      - name: Install the wheel and run it as a user would
        run: |
          set -euo pipefail
          python -m venv /tmp/v
          /tmp/v/bin/pip install --disable-pip-version-check -q dist/*.whl
          /tmp/v/bin/firedrill --help > /dev/null
          /tmp/v/bin/firedrill --version
          # The installed package must agree with pyproject about its version.
          test "$(/tmp/v/bin/python -c 'import firedrill; print(firedrill.__version__)')" \
             = "$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
      - name: A real restore, driven by the installed console script
        run: |
          set -euo pipefail
          python tests/make_corpus.py /tmp/corpus
          /tmp/v/bin/firedrill run /tmp/corpus/healthy_pg16.dump --json /tmp/r.json
          test "$(python -c 'import json;print(json.load(open("/tmp/r.json"))["ok"])')" = "True"
          # And the inverse, which matters exactly as much.
          if /tmp/v/bin/firedrill run /tmp/corpus/truncated_data.dump --quiet; then
            echo "a truncated backup exited 0"; exit 1
          fi
