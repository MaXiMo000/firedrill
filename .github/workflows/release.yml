name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The tests are the gate. A release that skips them is a promise nobody checked.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      # Install what pyproject declares, exactly as ci.yml does. This job was
      # written in Phase 0, when the project was stdlib-only, and never ran
      # until the first tag -- so it had never learned that PyYAML exists and
      # failed the release with ModuleNotFoundError. A workflow nobody has
      # executed is not a workflow that works.
      - name: Install the package and its declared dependencies
        run: python -m pip install --disable-pip-version-check -e ".[s3]"

      - run: python tests/test_firedrill.py --require-integration

      # The tag and the packaged version must be the same thing. Without this a
      # repo happily ships v0.2.0 built from a tree that still says 0.1.0, and
      # then advertises a version that does not match what installs.
      - name: The tag agrees with pyproject
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          declared="$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          echo "tag=$tag  pyproject=$declared"
          test "$tag" = "$declared"

  # Every tag gets a Release, not just a tag. A pushed tag with no Release is
  # how a project ends up advertising a version nobody can find.
  github-release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install build && python -m build
      - name: Create the Release with the artefacts attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The annotated tag's own message is the release body. A generated
          # commit list is a poor thing to greet someone with on a Marketplace
          # listing; what the tag was written to say is better, and it forces
          # the release notes to be written deliberately rather than derived.
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > /tmp/notes.md
          # Append the generated changelog under it, so nothing is lost.
          {
            echo
            echo "---"
            echo
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$GITHUB_REF_NAME" --jq .body
          } >> /tmp/notes.md

          gh release create "$GITHUB_REF_NAME" \
            --title "firedrill $GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md \
            dist/*
      - name: It exists, and points at this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --json tagName,isDraft \
            --jq 'select(.isDraft == false) | .tagName' | grep -qx "$GITHUB_REF_NAME"

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/firedrill
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      # buildx with the docker-container driver. The default `docker` driver
      # cannot build more than one platform, and says so only once a release is
      # already half-published: "Multi-platform build is not supported for the
      # docker driver". Another workflow that had never run until a tag existed.
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392  # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1

      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/firedrill
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  pypi:
    needs: verify
    # Enabled by setting the repository variable PYPI_ENABLED to "true", once a
    # trusted publisher exists on pypi.org for this repo. Gated rather than
    # failing, so tagging works before the account side is done.
    if: vars.PYPI_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write   # OIDC. No long-lived API token lives in this repo.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
